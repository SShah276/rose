services:
  - type: web
    name: rose
    env: python
    region: oregon
    plan: starter          # Persistent Disk requires a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /login

    disk:
      name: rose-data
      mountPath: /data
      sizeGB: 1            # $0.25/month — holds jobs.db

    envVars:
      - key: DATABASE_URL
        value: /data/jobs.db     # SQLite path on the persistent disk

      - key: ANTHROPIC_API_KEY
        sync: false              # Set manually in Render dashboard

      - key: SECRET_KEY
        generateValue: true      # Render generates a secure random value

      - key: APP_PASSWORD
        sync: false              # Set manually in Render dashboard

      - key: HUNTER_API_KEY
        sync: false              # Set manually in Render dashboard (optional)
