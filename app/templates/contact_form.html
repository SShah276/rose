<!DOCTYPE html>
<html>
<head>
    <title>ROSE — {{ 'Edit' if editing else 'Add' }} Contact</title>
    <link rel="stylesheet" href="/static/dark.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
               margin: 0; background: #f5f5f5; color: #111; }
        .shell { max-width: 600px; margin: 0 auto; padding: 20px; }

        .nav { display: flex; align-items: center; gap: 4px; padding-bottom: 12px;
               border-bottom: 1px solid #e5e7eb; margin-bottom: 20px; }
        .nav-brand { font-weight: 800; font-size: 15px; color: #111; text-decoration: none;
                     margin-right: 12px; letter-spacing: -0.3px; }
        .nav a { text-decoration: none; color: #555; font-size: 13px; font-weight: 600;
                 padding: 4px 9px; border-radius: 6px; }
        .nav a:hover { background: #f3f4f6; color: #111; }
        .nav a.active { background: #111; color: white; }
        .nav-spacer { flex: 1; }

        .card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 24px; }
        .card-title { font-size: 16px; font-weight: 700; margin: 0 0 20px; }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #555;
                margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
        input[type="text"], input[type="email"], input[type="url"],
        input[type="number"], select, textarea {
            width: 100%; padding: 7px 10px; border: 1px solid #e5e7eb; border-radius: 6px;
            font-size: 13px; color: #111; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
        textarea { resize: vertical; height: 70px; }
        .hint { font-size: 11px; color: #aaa; margin-top: 4px; }

        .form-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
        .btn-submit { background: #111; color: white; border: none; border-radius: 7px;
                      padding: 9px 22px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-submit:hover { background: #374151; }
        .btn-cancel { color: #aaa; text-decoration: none; font-size: 13px; }
        .btn-cancel:hover { color: #555; }
    </style>
</head>
<body>
<div class="shell">

    <nav class="nav">
        <a href="/jobs" class="nav-brand">ROSE</a>
        <a href="/jobs">Jobs</a>
        <a href="/tracker">Tracker</a>
        <a href="/outreach">Outreach</a>
        <a href="/profile">Profile</a>
        <a href="/analytics">Analytics</a>
        <div class="nav-spacer"></div>
        <a href="/logout" style="color:#9ca3af; font-size:12px;">Logout</a>
        <a href="/settings">Settings</a>
    </nav>

    <div class="card">
        <p class="card-title">{{ 'Edit' if editing else 'Add' }} Contact</p>

        <form method="POST" action="{{ '/contacts/' + contact.id|string + '/edit' if editing else '/contacts' }}">
            {% if job_id %}
            <input type="hidden" name="job_id" value="{{ job_id }}">
            <input type="hidden" name="relationship_type" value="{{ relationship_type or 'recruiter' }}">
            {% endif %}

            <div class="grid2">
                <div class="field">
                    <label>Full Name *</label>
                    <input type="text" name="name" value="{{ contact.get('name', '') }}" required>
                </div>
                <div class="field">
                    <label>Company *</label>
                    <input type="text" name="company" value="{{ contact.get('company', '') }}" required>
                </div>
            </div>

            <div class="field">
                <label>Title / Role</label>
                <input type="text" name="title" value="{{ contact.get('title', '') }}"
                       placeholder="Senior Technical Recruiter">
            </div>

            <div class="grid2">
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ contact.get('email', '') }}">
                </div>
                <div class="field">
                    <label>Source</label>
                    <select name="source">
                        {% for src in ['manual', 'linkedin', 'referral', 'recruiter_email', 'career_fair', 'other'] %}
                        <option value="{{ src }}" {{ 'selected' if contact.get('source') == src else '' }}>
                            {{ src | replace('_', ' ') | title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="field">
                <label>LinkedIn URL</label>
                <input type="url" name="linkedin_url" value="{{ contact.get('linkedin_url', '') }}"
                       placeholder="https://linkedin.com/in/...">
            </div>

            <div class="field">
                <label>Confidence Score</label>
                <input type="number" name="confidence_score"
                       value="{{ contact.get('confidence_score', 100) }}" min="1" max="100">
                <div class="hint">1–100. Manual entry = 100. Lower for less certain contacts.</div>
            </div>

            <div class="field">
                <label>Notes</label>
                <textarea name="notes" placeholder="Met at career fair. Mentioned SWE openings in Chicago.">{{ contact.get('notes', '') }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    {{ 'Save Changes' if editing else 'Add Contact' }}
                </button>
                <a href="/contacts" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
