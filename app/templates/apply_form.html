<!DOCTYPE html>
<html>
<head>
    <title>ROSE — Mark Applied</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
               margin: 0; background: #f5f5f5; color: #111; }
        .shell { max-width: 560px; margin: 0 auto; padding: 20px; }

        .nav { display: flex; align-items: center; gap: 4px; padding-bottom: 12px;
               border-bottom: 1px solid #e5e7eb; margin-bottom: 20px; }
        .nav-brand { font-weight: 800; font-size: 15px; color: #111; text-decoration: none;
                     margin-right: 12px; letter-spacing: -0.3px; }
        .nav a { text-decoration: none; color: #555; font-size: 13px; font-weight: 600;
                 padding: 4px 9px; border-radius: 6px; }
        .nav a:hover { background: #f3f4f6; color: #111; }
        .nav a.active { background: #111; color: white; }
        .nav-spacer { flex: 1; }

        .card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 24px; }
        .card-company { font-size: 17px; font-weight: 700; margin: 0 0 2px; }
        .card-meta { font-size: 13px; color: #888; margin: 0 0 20px; }

        .field { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #555;
                margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
        input[type="date"], input[type="text"], input[type="url"], textarea {
            width: 100%; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px;
            font-size: 13px; color: #111; font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #16a34a; }
        textarea { height: 80px; resize: vertical; }
        .hint { font-size: 11px; color: #aaa; margin-top: 4px; }

        .form-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
        .btn-submit { background: #16a34a; color: white; border: none; border-radius: 7px;
                      padding: 9px 22px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-submit:hover { background: #15803d; }
        .btn-cancel { color: #aaa; text-decoration: none; font-size: 13px; }
        .btn-cancel:hover { color: #555; }
    </style>
</head>
<body>
<div class="shell">

    <nav class="nav">
        <a href="/jobs" class="nav-brand">ROSE</a>
        <a href="/jobs" class="active">Jobs</a>
        <a href="/tracker">Tracker</a>
        <a href="/outreach">Outreach</a>
        <a href="/profile">Profile</a>
        <a href="/analytics">Analytics</a>
        <div class="nav-spacer"></div>
        <a href="/logout" style="color:#9ca3af; font-size:12px;">Logout</a>
        <a href="/settings">Settings</a>
    </nav>

    <div class="card">
        <p class="card-company">{{ job.company }} — {{ job.title }}</p>
        <p class="card-meta">{{ job.location or "" }}</p>

        <form method="POST" action="/jobs/{{ job.id }}/apply">
            <div class="field">
                <label>Date Applied</label>
                <input type="date" name="date_applied" value="{{ today }}" required>
            </div>

            <div class="field">
                <label>Application URL</label>
                <input type="url" name="application_url" value="{{ job.url or '' }}" placeholder="https://...">
                <div class="hint">Where you submitted (if different from the job link)</div>
            </div>

            <div class="field">
                <label>Resume Used</label>
                <input type="text" name="resume_used" placeholder="e.g. SWE_Resume_v3.pdf">
            </div>

            <div class="field">
                <label>Notes</label>
                <textarea name="notes" placeholder="Referral, recruiter name, anything to remember…"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Save Application</button>
                <a href="/jobs" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
