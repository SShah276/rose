<!DOCTYPE html>
<html>
<head>
    <title>ROSE — Sign In</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
               margin: 0; background: #f5f5f5; color: #111;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 14px;
                padding: 44px 40px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 4px; }
        .sub   { font-size: 13px; color: #9ca3af; margin: 0 0 32px; }
        label  { display: block; font-size: 11px; font-weight: 700; color: #374151;
                 text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%; padding: 10px 13px; border: 1px solid #e5e7eb; border-radius: 7px;
            font-size: 14px; color: #111; font-family: inherit;
        }
        input[type="password"]:focus { outline: none; border-color: #7c3aed;
                                        box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
        button { width: 100%; margin-top: 20px; padding: 11px; background: #111; color: white;
                 border: none; border-radius: 7px; font-size: 14px; font-weight: 700;
                 cursor: pointer; font-family: inherit; }
        button:hover { background: #374151; }
        .error { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c;
                 border-radius: 7px; padding: 9px 13px; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="card">
    <p class="brand">ROSE</p>
    <p class="sub">Recruiting OS — sign in to continue</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Password</label>
        <input type="password" name="password" autofocus placeholder="Enter your password">
        <button type="submit">Sign In →</button>
    </form>
</div>
</body>
</html>
