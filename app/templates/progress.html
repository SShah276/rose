<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generating Plan — ROSE</title>
  <link rel="stylesheet" href="/static/dark.css">
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #111; }

    .shell { max-width: 460px; margin: 80px auto; padding: 0 20px; }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 40px 32px;
    }

    .card-header { text-align: center; margin-bottom: 32px; }
    .card-header h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    .card-header p { font-size: 0.85rem; color: #6b7280; }

    .steps { display: flex; flex-direction: column; gap: 12px; }

    .step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
      transition: border-color 0.2s, background 0.2s;
    }
    .step.running { border-color: #6366f1; background: #eef2ff; }
    .step.done    { border-color: #22c55e; background: #f0fdf4; }
    .step.error   { border-color: #ef4444; background: #fef2f2; }

    .step-icon { width: 22px; text-align: center; flex-shrink: 0; font-size: 1rem; }

    .step-body { flex: 1; }
    .step-name  { font-size: 0.875rem; font-weight: 600; }
    .step-label { font-size: 0.775rem; color: #9ca3af; margin-top: 2px; }
    .step.running .step-label { color: #6366f1; }
    .step.done    .step-label { color: #16a34a; }
    .step.error   .step-label { color: #dc2626; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 15px; height: 15px;
      border: 2px solid #c7d2fe;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      vertical-align: middle;
    }

    .error-msg {
      margin-top: 20px;
      padding: 12px 14px;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #dc2626;
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: #9ca3af;
      text-decoration: none;
    }
    .back-link:hover { color: #6b7280; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="card-header">
        <h1>✦ Running AI Agents</h1>
        <p>Three agents are analyzing your pipeline — takes about 15–20 seconds.</p>
      </div>

      <div class="steps">
        <div class="step" id="step-discovery">
          <div class="step-icon" id="icon-discovery">○</div>
          <div class="step-body">
            <div class="step-name">Discovery Agent</div>
            <div class="step-label" id="label-discovery">Waiting to start...</div>
          </div>
        </div>

        <div class="step" id="step-evaluation">
          <div class="step-icon" id="icon-evaluation">○</div>
          <div class="step-body">
            <div class="step-name">Evaluation Agent</div>
            <div class="step-label" id="label-evaluation">Waiting...</div>
          </div>
        </div>

        <div class="step" id="step-outreach">
          <div class="step-icon" id="icon-outreach">○</div>
          <div class="step-body">
            <div class="step-name">Outreach Agent</div>
            <div class="step-label" id="label-outreach">Waiting...</div>
          </div>
        </div>
      </div>

      <div class="error-msg" id="error-box"></div>
    </div>

    <a href="/jobs" class="back-link">← cancel and go back</a>
  </div>

  <script>
    function setStep(name, state, label) {
      const el   = document.getElementById('step-' + name);
      const icon = document.getElementById('icon-' + name);
      const lbl  = document.getElementById('label-' + name);
      el.className = 'step ' + state;
      lbl.textContent = label;
      if (state === 'running') {
        icon.innerHTML = '<span class="spinner"></span>';
      } else if (state === 'done') {
        icon.textContent = '✓';
      } else if (state === 'error') {
        icon.textContent = '✗';
      }
    }

    const es = new EventSource('/plan/stream');

    es.onmessage = function(e) {
      const data = JSON.parse(e.data);

      if (data.step === 'discovery') {
        if (data.status === 'running') {
          setStep('discovery', 'running', 'Scanning opportunities...');
        } else if (data.status === 'done') {
          const n = data.count;
          setStep('discovery', 'done', `Found ${n} opportunit${n === 1 ? 'y' : 'ies'}`);
        } else {
          setStep('discovery', 'error', 'Failed — continuing with other agents');
        }
      }

      if (data.step === 'evaluation') {
        if (data.status === 'running') {
          setStep('evaluation', 'running', 'Evaluating priorities...');
        } else if (data.status === 'done') {
          const n = data.count;
          setStep('evaluation', 'done', `${n} action${n === 1 ? '' : 's'} prioritized`);
        } else {
          setStep('evaluation', 'error', 'Failed — continuing with outreach');
        }
      }

      if (data.step === 'outreach') {
        if (data.status === 'running') {
          setStep('outreach', 'running', 'Planning outreach...');
        } else if (data.status === 'done') {
          const n = data.count;
          setStep('outreach', 'done', `${n} outreach action${n === 1 ? '' : 's'}`);
        } else {
          setStep('outreach', 'error', 'Failed');
        }
      }

      if (data.step === 'complete') {
        es.close();
        window.location.href = data.redirect || '/jobs';
      }
    };

    es.onerror = function() {
      es.close();
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent = 'Connection lost. Redirecting to jobs in 2 seconds...';
      setTimeout(function() { window.location.href = '/jobs'; }, 2000);
    };
  </script>
</body>
</html>
