<!DOCTYPE html>
<html>
<head>
    <title>Import Jobs from CSV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .topbar {
            margin-bottom: 20px;
        }
        .topbar a {
            margin-right: 16px;
            text-decoration: none;
            color: blue;
        }
        form {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/jobs">Jobs</a>
        <a href="/import/csv">Import CSV</a>
    </div>

    <h1>Import Jobs from CSV</h1>

    <p>Required columns: <code>company</code>, <code>title</code>, <code>location</code></p>
    <p>Optional columns: <code>salary</code>, <code>url</code>, <code>description</code>, <code>date_posted</code></p>

    <form action="/import/csv" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv" required>
        <button type="submit">Upload CSV</button>
    </form>
</body>
</html>
